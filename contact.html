<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Neil.Folio</title>
  <link rel="icon" type="image/png" href="images/ui/NJS_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
      .custom-contact-card { max-width: 650px; margin: 0 auto; padding: 50px !important; background: #ffffff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); text-align: left; position: relative; overflow: hidden; box-sizing: border-box !important; width: 100% !important; }
      .custom-contact-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #111a8b; }
      input, textarea { background: rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 8px; padding: 14px 18px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #0f172a; transition: all 0.3s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); box-sizing: border-box; width: 100%; }
      input:focus, textarea:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); outline: none; }
      label { display: block; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; color: #0f172a; margin-bottom: 8px; }
      .form-submit-btn { background-color: #111a8b; color: #ffffff; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 15px 30px; border: none; transition: all 0.3s ease; cursor: pointer; width: 100%; margin-top: 10px; }
      .form-submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(17, 26, 139, 0.3); background-color: #1c2bd1; }
  </style>
</head>
<body style="background-color: #f8fafc; overflow-x: hidden;">
  <nav data-include="components/nav.html"></nav>

  <main style="padding-top: 120px; padding-bottom: 100px; background-color: #f8fafc; min-height: 80vh;">
    <section style="width: 100%; max-width: 800px; margin: 0 auto; padding: 0 max(1rem, 3vw);">

        <div style="text-align: center; margin-bottom: 4rem;" class="reveal active">
            <h1 style="font-family: 'Inter', sans-serif; font-size: clamp(3rem, 5vw, 4.5rem); font-weight: 900; letter-spacing: -2px; color: #0f172a; margin-bottom: 1rem; margin-top: 0;">
                Contact
            </h1>
            <p style="font-family: 'Inter', sans-serif; font-size: 1.15rem; color: #64748b; line-height: 1.6; margin: 0;">
                Let's build something together, shall we?
            </p>
        </div>

        <div class="custom-contact-card reveal active">
            <form id="contact-form" action="https://formsubmit.co/santiago.neiljacob@clsu2.edu.ph" method="POST">
                <input type="hidden" name="_subject" value="New Portfolio Message!">
                <input type="hidden" name="_captcha" value="false">
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label>Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="first_name" required>
                        <span style="font-size: 11px; color: #64748b; font-family: 'Inter', sans-serif; margin-top: 4px; display: block;">First</span>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label>&nbsp;</label>
                        <input type="text" name="last_name" required>
                        <span style="font-size: 11px; color: #64748b; font-family: 'Inter', sans-serif; margin-top: 4px; display: block;">Last</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label>Email <span style="color: #ef4444;">*</span></label>
                    <input type="email" name="email" required>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label>Comment or Message</label>
                    <textarea name="message" rows="5"></textarea>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label id="captcha-label">Security Check <span style="color: #ef4444;">*</span></label>
                    <input type="number" id="captcha-input" required placeholder="Your answer">
                </div>

                <button type="submit" class="form-submit-btn">Submit</button>
            </form>
        </div>

    </section>
  </main>

  <footer data-include="components/footer.html"></footer>
  <script src="js/script.js"></script>
  <script>
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      document.getElementById('captcha-label').innerHTML = `What is ${num1} + ${num2}? <span style="color: #ef4444;">*</span>`;
      
      document.getElementById('contact-form').addEventListener('submit', function(e) {
          const answer = document.getElementById('captcha-input').value;
          if (parseInt(answer) !== (num1 + num2)) {
              e.preventDefault();
              alert('Incorrect math answer. Please try again.');
          }
      });
  </script>
</body>
</html>
